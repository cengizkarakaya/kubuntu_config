[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = true
show_symlink = true
linemode = "size_and_mtime"

[preview]
image_delay = 50
max_width = 1000
max_height = 1000

[opener]
edit = [
    { run = "hx %s", block = true, for = "unix" },
]

extract = [
    { run = "ya pub extract --list %s", desc = "Extract here" },
]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
