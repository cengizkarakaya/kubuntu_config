name: Static bootstrap checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test private-data guard with synthetic Git repositories
        run: |
          python3 -B tests/test-privacy.py
          python3 -B tests/test-privacy-hooks.py
      - name: Check committed tree without disclosing private values
        run: python3 -B scripts/check-privacy.py --tree HEAD

  bash-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bash syntax check
        run: |
          find . -name '*.sh' -type f -print0 | xargs -0 -r -n1 bash -n
          bash -n scripts/sysup
          bash -n scripts/kubuntu-power-menu
          bash -n verify.sh
          bash -n bootstrap.sh
      - name: Check Bash mode policy and independent fixtures
        run: |
          python3 -B scripts/check-bash-modes.py
          python3 -B tests/test-bash-modes.py
      - name: Exercise installer failure paths without APT, Flatpak or sudo changes
        run: bash tests/test-installers.sh
      - name: Test opt-in network-monitoring profile (no Docker daemon or APT changes)
        run: bash tests/test-network-monitoring.sh
      - name: Test narrow NetAlertX API nftables guard (no host firewall writes)
        run: bash tests/test-netalertx-api-guard.sh
      - name: Test sysup failure isolation, resume and safe cancellation (mocked)
        run: bash tests/test-sysup.sh
      - name: Validate opt-in science plan and private KDE menu snapshot
        run: |
          bash tests/test-science-profile.sh
          bash tests/test-menu-backup.sh
      - name: Check ROS 2 Compose wrapper safety (no Docker daemon)
        run: bash tests/test-ros2-compose.sh
      - name: Validate opt-in RViz2 NVIDIA/XWayland profile
        run: bash tests/test-ros2-rviz.sh
      - name: Validate provisional TIO description and safe initial copy
        run: bash tests/test-tio-description.sh
      - name: Test Celestia source-build retry safety (offline)
        run: bash tests/test-celestia-builder.sh
      - name: Test GDAL 3.13 source fix and incremental OpenSpace resume
        run: bash tests/test-openspace-gdal-patch.sh
      - name: Test OpenSpace installer preflight (offline)
        run: bash tests/test-openspace-builder.sh
      - name: Test astronomy KDE launchers (mocked, non-destructive)
        run: bash tests/test-astronomy-launchers.sh

      - name: Test ROS 2 graphical desktop launchers (mocked, non-destructive)
        run: bash tests/test-ros2-launchers.sh
      - name: Test optional native KWin Alacritty rule (mocked config tools)
        run: bash tests/test-host-alacritty-rule.sh
      - name: Verify interactive Bash eza/zoxide integration and Alacritty TOML
        run: bash tests/test-shell-terminal.sh
      - name: Reject unverified or non-stable GitHub releases
        run: bash tests/test-latest-release.sh
      - name: Test installed-vs-repository version audit failure handling
        run: bash tests/test-version-audit.sh
      - name: Test private inventory capture and comparison
        run: bash tests/test-inventory-snapshot.sh
      - name: Test Conda recovery with mocked CLI (no installs)
        run: bash tests/test-conda-envs.sh
      - name: Test encrypted backup wrapper guards (mocked Restic)
        run: bash tests/test-backup-personal.sh
      - name: Check local documentation links and heading anchors (offline)
        run: |
          python3 -B tests/test-doc-links.py
          python3 -B scripts/check-doc-links.py
      - name: Assert independent legacy and declarative repository policy
        run: |
          python3 -B tests/test-policy-legacy.py
          python3 -B scripts/check-policy.py
          python3 -B tests/test-policy.py

  herdr-release-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install newest stable Herdr release, verify checksum and idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="$(bash scripts/latest-release.sh herdrdev/herdr herdr-linux-x86_64 | cut -f1)"
          bash scripts/install-herdr.sh
          test "$("$HOME/.local/bin/herdr" --version)" = "herdr ${tag#v}"
          bash scripts/install-herdr.sh
          echo '[PASS] Latest Herdr verified'

  helix-bottom-official-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install and verify latest Helix and Bottom upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/install-helix.sh
          test -x "$HOME/.local/bin/hx"
          test -d "$HOME/.config/helix/runtime"
          "$HOME/.local/bin/hx" --version
          bash scripts/install-helix.sh
          bash scripts/install-bottom.sh
          "$HOME/.local/bin/btm" --version
          bash scripts/install-bottom.sh
          echo '[PASS] Official SHA-256 checked latest stable Helix and Bottom'

  yazi-package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install signed upstream Yazi and pinned Arch packages
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg git
          curl -fsSL https://yazi-rs.github.io/builds/yazi-keyring.gpg > /tmp/yazi-ci.gpg
          gpg --batch --show-keys /tmp/yazi-ci.gpg
          sudo install -Dm644 /tmp/yazi-ci.gpg /usr/share/keyrings/yazi-keyring.gpg
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/yazi-keyring.gpg] https://yazi-rs.github.io/builds/ stable main' | sudo tee /etc/apt/sources.list.d/yazi-ci.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yazi
          command -v ya
          mkdir -p "$HOME/.config/yazi"
          cp dotfiles/yazi/.config/yazi/package.toml "$HOME/.config/yazi/package.toml"
          ya pkg install
          for p in git full-border toggle-pane smart-enter jump-to-char smart-filter smart-paste chmod mount diff; do
            test -d "$HOME/.config/yazi/plugins/$p.yazi"
          done
          test -d "$HOME/.config/yazi/flavors/nord.yazi"
          echo '[PASS] All 10 Arch Yazi plugins and Nord flavor installed from pinned manifest'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with checksum-verified Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset" \
            --output "$tmp/$asset"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tmp/$asset" | sha256sum -c -
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          "$tmp/gitleaks" version
          status=0
          "$tmp/gitleaks" git --redact=100 --no-banner --log-opts="--all" \
            --report-format json --report-path "$tmp/findings.json" --exit-code 23 . || status=$?
          if [[ "$status" == 23 ]]; then
            # Print only location and rule metadata; never the match or secret.
            python3 - "$tmp/findings.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as report:
              for finding in json.load(report):
                  print(json.dumps({key: finding.get(key) for key in
                                    ("RuleID", "File", "StartLine", "Commit")}, ensure_ascii=True))
          PY
          fi
          exit "$status"

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install ShellCheck from signed Ubuntu repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: ShellCheck warning baseline (blocking)
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck --version
          mapfile -d '' -t files < <(git ls-files -z -- '*.sh' scripts/sysup scripts/kubuntu-power-menu scripts/yazi-rg)
          test "${#files[@]}" -gt 0
          shellcheck -S warning -x "${files[@]}"

  python-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Bandit from signed Ubuntu repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bandit
          /usr/bin/python3 --version
          /usr/bin/python3 /usr/bin/bandit --version
          dpkg-query -W bandit
      - name: Scan tracked Python files and enforce high-severity baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          git ls-files -z -- '*.py' > "$tmp/files"
          mapfile -d '' -t files < "$tmp/files"
          test "${#files[@]}" -gt 0
          # Do not allow source-level nosec comments to suppress this initial review.
          status=0
          # Smoke test an intentionally unsafe synthetic source file; never execute it.
          printf '%s\n' 'import subprocess' 'subprocess.run("echo fixture", shell=True)' > "$tmp/probe.py"
          probe_status=0
          /usr/bin/python3 /usr/bin/bandit --ignore-nosec -f json -o "$tmp/probe.json" "$tmp/probe.py" || probe_status=$?
          python3 - "$tmp/probe.json" "$probe_status" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if report["errors"] or sys.argv[2] != "1" or not any(
              item["test_id"] == "B602" for item in report["results"]
          ):
              sys.exit("[FAIL] Bandit synthetic detection probe failed")
          print("[PASS] Bandit synthetic detection probe")
          PY
          /usr/bin/python3 /usr/bin/bandit --ignore-nosec -f json -o "$tmp/report.json" "${files[@]}" 2>"$tmp/scanner.log" || status=$?
          if grep -Eiq '\b(error|critical)\b' "$tmp/scanner.log"; then
            echo '[FAIL] Bandit reported an internal scanner error; inspect privately.'
            exit 2
          fi
          python3 - "$tmp/report.json" "$tmp/files" "$status" <<'PY'
          import collections
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = {x.decode() for x in pathlib.Path(sys.argv[2]).read_bytes().split(b"\0") if x}
          metrics = report["metrics"]
          scanned = {pathlib.Path(name).as_posix() for name in metrics if name != "_totals"}
          findings = report["results"]
          status = int(sys.argv[3])
          if report["errors"] or scanned != expected or status != int(bool(findings)):
              print(f"[FAIL] Bandit incomplete: expected={len(expected)}, scanned={len(scanned)}, errors={len(report['errors'])}, exit={status}, findings={len(findings)}")
              sys.exit(2)
          counts = collections.Counter(
              (item["test_id"], item["issue_severity"], item["issue_confidence"])
              for item in findings
          )
          for (rule, severity, confidence), count in sorted(counts.items()):
              print(f"{rule}: {severity}/{confidence}: {count}")
          # Source snippets and full JSON are deliberately not printed or uploaded.
          for item in findings:
              print(f'{item["test_id"]}: {item["filename"]}:{item["line_number"]}')
          high = sum(item["issue_severity"] == "HIGH" for item in findings)
          print(f"Bandit scanned {len(scanned)} files; {len(findings)} findings, {high} high severity.")
          sys.exit(1 if high else 0)
          PY

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile tracked Python source (blocking)
        shell: bash
        run: |
          set -Eeuo pipefail
          git ls-files -z -- '*.py' | xargs -0 -r python3 -m compileall -q
      - name: Ruff correctness and default rules (blocking)
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          asset=ruff-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/astral-sh/ruff/releases/download/0.17.6/$asset" \
            --output "$tmp/$asset"
          printf '%s  %s\n' '94b33791f48cd54ab35ad673a443a5c001d3e6d87effeaba9899070b700d45f3' "$tmp/$asset" | sha256sum -c -
          tar -xzf "$tmp/$asset" -C "$tmp" ruff-x86_64-unknown-linux-gnu/ruff
          ruff="$tmp/ruff-x86_64-unknown-linux-gnu/ruff"
          "$ruff" --version
          mapfile -d '' -t files < <(git ls-files -z -- '*.py')
          test "${#files[@]}" -gt 0
          # Start with syntax and high-confidence correctness checks, not style.
          "$ruff" check --isolated --select E9,F63,F7,F82 --output-format concise "${files[@]}"
          "$ruff" check --isolated --output-format concise "${files[@]}"
