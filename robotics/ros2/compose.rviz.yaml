# Optional graphics overlay loaded only by ros2-env.sh rviz-* commands.
services:
  dev:
    ipc: shareable

  rviz:
    profiles: [gui]
    image: kubuntu-config/ros2-lyrical-rviz:local
    build:
      context: .
      dockerfile: Dockerfile.rviz
      args:
        ROS_UID: "${ROS_UID:?Set via scripts/ros2-env.sh}"
        ROS_GID: "${ROS_GID:?Set via scripts/ros2-env.sh}"
    depends_on: [dev]
    init: true
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    # Join dev's loopback DDS discovery network and shared-memory IPC.
    network_mode: "service:dev"
    ipc: "service:dev"
    runtime: nvidia
    gpus: all
    environment:
      ROS_DOMAIN_ID: "42"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      DISPLAY: "${DISPLAY:?XWayland DISPLAY must be available}"
      XAUTHORITY: /tmp/.Xauthority
      QT_QPA_PLATFORM: xcb
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility,compute
      HOME: /home/rosdev
      XDG_RUNTIME_DIR: /tmp/runtime-rosdev
    volumes:
      # Persist RViz2 window, display and user configuration outside Docker.
      # The helper creates this as a user-owned directory before first start.
      - type: bind
        source: "${ROBOTICS_ROOT:?Set via scripts/ros2-env.sh}/rviz2-config"
        target: /home/rosdev/.rviz2
        bind:
          create_host_path: false
      # Qt, rqt and PlotJuggler preferences survive container recreation.
      - type: bind
        source: "${ROBOTICS_ROOT:?Set via scripts/ros2-env.sh}/ros-gui-config"
        target: /home/rosdev/.config
        bind:
          create_host_path: false
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RVIZ_XAUTH:?Generated by scripts/ros2-env.sh rviz-up}"
        target: /tmp/.Xauthority
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOTICS_ROOT:?Set via scripts/ros2-env.sh}/tio_ws"
        target: /workspaces/tio_ws
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOTICS_ROOT:?Set via scripts/ros2-env.sh}/rova_ws"
        target: /workspaces/rova_ws
        bind:
          create_host_path: false
